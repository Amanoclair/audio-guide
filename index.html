<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>À la découverte de 2 souvenirs de Clairefontaine</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
      background-color: #121212;
      color: #ffffff;
      text-align: center;
      box-sizing: border-box;
    }
    .org-name {
      font-size: 0.9rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #aaaaaa;
      margin-bottom: 0.5rem;
    }
    h1 {
      font-size: 1.4rem;
      margin-top: 0;
      margin-bottom: 1.5rem;
      max-width: 500px;
      line-height: 1.3;
    }
    #play-btn {
      background-color: #ff5500;
      color: white;
      border: none;
      padding: 18px 36px;
      font-size: 1.2rem;
      font-weight: bold;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(255, 85, 0, 0.4);
      margin-bottom: 24px;
    }
    #play-btn:active {
      transform: scale(0.97);
    }
    .player-wrap {
      width: 100%;
      max-width: 500px;
    }
  </style>
</head>
<body>

  <div class="org-name">Comité Histoire Amanoclair</div>
  <h1>À la découverte de 2 souvenirs de Clairefontaine</h1>

  <button id="play-btn">▶ Lancer l'écoute</button>

  <div class="player-wrap">
    <iframe 
      id="sc-widget" 
      width="100%" 
      height="300" 
      scrolling="no" 
      frameborder="no" 
      allow="autoplay; encrypted-media" 
      src="https://w.soundcloud.com/player/?url=https%3A//api.soundcloud.com/tracks/soundcloud%253Atracks%253A2445207240&color=%23ff5500&auto_play=true&hide_related=true&show_comments=false&show_user=true&show_reposts=false&show_teaser=false&visual=true
">
    </iframe>
  </div>

  <script src="https://w.soundcloud.com/player/api.js"></script>
  <script>
    const iframe = document.getElementById('sc-widget');
    const widget = SC.Widget(iframe);
    const playBtn = document.getElementById('play-btn');

    // Tentative de lecture automatique dès que le lecteur est prêt
    widget.bind(SC.Widget.Events.READY, () => {
      widget.play();
    });

    // Masque le bouton une fois que la lecture démarre
    widget.bind(SC.Widget.Events.PLAY, () => {
      playBtn.style.display = 'none';
    });

    // Déclenchement au toucher pour iOS et Android
    playBtn.addEventListener('click', () => {
      widget.play();
    });
  </script>

</body>
</html>
